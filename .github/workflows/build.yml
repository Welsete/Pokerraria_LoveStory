name: Build mod

on: [push, pull_request, workflow_dispatch]

permissions:
    contents: write

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: JamzOJamz/build-tmodloader-mod@v1
              with:
                  project: Terramon/Terramon.csproj
                  dotnet-version: |
                      8.0.x
                      10.0.x
            # Terramon needs this dependency mod for turn-based battles, so build it too
            - uses: JamzOJamz/build-tmodloader-mod@v1
              with:
                  project: TmonRuntimes/TmonRuntimes.csproj
                  dotnet-version: |
                      8.0.x
                      10.0.x
            # Publish the .tmod files as a release so they can be downloaded without signing in
            - name: Publish test build
              if: github.event_name != 'pull_request'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  tag="build-${GITHUB_REF_NAME//\//-}"
                  gh release delete "$tag" --yes --cleanup-tag -R "$GITHUB_REPOSITORY" || true
                  gh release create "$tag" "$RUNNER_TEMP"/tmlsave/Mods/*.tmod --prerelease --target "$GITHUB_SHA" \
                      --title "Teste $GITHUB_REF_NAME" --notes "Build automático de $GITHUB_SHA" -R "$GITHUB_REPOSITORY"
