name: Build mod

on: [push, pull_request, workflow_dispatch]

permissions:
    contents: write

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: JamzOJamz/build-tmodloader-mod@v1
              with:
                  project: Terramon/Terramon.csproj
                  dotnet-version: |
                      8.0.x
                      10.0.x
            # Terramon needs this dependency mod for turn-based battles, so build it too
            - uses: JamzOJamz/build-tmodloader-mod@v1
              with:
                  project: TmonRuntimes/TmonRuntimes.csproj
                  dotnet-version: |
                      8.0.x
                      10.0.x
            - name: Diagnose (temporary)
              if: failure()
              run: |
                  ls -la "$RUNNER_TEMP" || true
                  find "$RUNNER_TEMP" -maxdepth 3 -name "*.log" | head -20 | while read f; do echo "::warning::LOGFILE $f"; done
                  for f in $(find "$RUNNER_TEMP" "$HOME" -maxdepth 5 \( -name "*.log" -o -name "Logs" \) 2>/dev/null | head -20); do
                      grep -rhE "error|Error|Exception" "$f" 2>/dev/null | head -40 | while IFS= read -r l; do echo "::warning::${l:0:900}"; done
                  done
                  cd TmonRuntimes && (dotnet build TmonRuntimes.csproj 2>&1 | grep -E "error|Error" | head -40 | while IFS= read -r l; do echo "::warning::RT ${l:0:900}"; done) || true
                  cd ../Terramon && (dotnet build Terramon.csproj 2>&1 | grep -E " error |Error" | sort -u | head -40 | while IFS= read -r l; do echo "::warning::TM ${l:0:900}"; done) || true
            # Publish the .tmod files as a release so they can be downloaded without signing in
            - name: Publish test build
              if: github.event_name != 'pull_request'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  tag="build-${GITHUB_REF_NAME//\//-}"
                  files=("$RUNNER_TEMP"/tmlsave/Mods/*.tmod)
                  # Reuse one release per branch: replace its files instead of recreating it
                  if gh release view "$tag" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
                      gh release upload "$tag" "${files[@]}" --clobber -R "$GITHUB_REPOSITORY"
                  else
                      gh release create "$tag" "${files[@]}" --prerelease --target "$GITHUB_SHA" \
                          --title "Teste $GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY"
                  fi
                  gh release edit "$tag" --draft=false --prerelease --notes "Build automático de $GITHUB_SHA" -R "$GITHUB_REPOSITORY"
