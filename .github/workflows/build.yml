name: Dump IDs

on: [push]

jobs:
    dump:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: JamzOJamz/build-tmodloader-mod@v1
              with:
                  project: TmonRuntimes/TmonRuntimes.csproj
                  dotnet-version: |
                      8.0.x
                      10.0.x
            - name: Dump
              run: |
                  dll=$(find "$RUNNER_TEMP" / -name tModLoader.dll -not -path '*/proc/*' 2>/dev/null | head -1)
                  echo "dll=$dll"
                  dotnet run --project tools/dumpids -- "$dll" > ids.txt
                  wc -l ids.txt
                  cat ids.txt
